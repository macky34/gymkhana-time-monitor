; timemon sensor firmware (ESP32 DevKit / Seeed XIAO ESP32C6 / ESP32C5).
; start/goal share one firmware; config.h selects SENSOR_ID / SSID / RPi IP.
; XIAO (C5/C6) support added via the seeed_xiao envs below (see the
; [seeed_xiao] section's comment for why it needs a non-official platform).
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2

[env:esp32dev]
platform = espressif32
board = esp32dev

; XIAO series (C5/C6) is unified on Seeed's official pioarduino-based
; platform-seeedboards. Reasons this isn't the official
; platformio/platform-espressif32:
;   - ESP32-C5 has no board definition in pioarduino's platform-espressif32
;     as of this writing; Seeed's own repo is the only PlatformIO platform
;     that ships one.
;   - Using the same platform for both C5 and C6 keeps the two XIAO envs on
;     one Arduino core version instead of straddling two forks.
; Pinned to the 1.0.0 tag (Arduino core 3.3.7, per that repo's platform.json).
[seeed_xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.0.0
; esptool は platform.json が Seeed 配布の v5.1.2 を指定しているが、同じ
; ~/.platformio/packages/tool-esptoolpy を espressif32 (esp32dev env) も使う。
; 先に esp32dev をビルドするとそちらの v4.x が居座り、Seeed のビルド
; スクリプトが渡す v5 系の引数 (--flash-mode 等) を解釈できずに失敗する。
; env 順やビルド履歴に結果が左右されるため、ここで明示的に固定する。
platform_packages =
    tool-esptoolpy@https://files.seeedstudio.com/arduino/platformio/esptoolpy-v5.1.2.zip

; Seeed Studio XIAO ESP32C6.
[env:seeed_xiao_esp32c6]
extends = seeed_xiao
board = seeed-xiao-esp32-c6

; Seeed Studio XIAO ESP32C5. Same physical pin layout as the C6 (D1/D-series
; pins), but no GPIO-controlled antenna switch (fixed onboard u.FL antenna)
; and 2.4/5GHz dual-band radio -- main.cpp pins it to 2.4GHz since the venue
; AP is 2.4GHz only.
[env:seeed_xiao_esp32c5]
extends = seeed_xiao
board = seeed-xiao-esp32-c5
